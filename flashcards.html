<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduPulse | Flashcards</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar">
    <div class="logo" onclick="location.href='index.html'">Edu<span>Pulse</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="quiz.html">Quiz</a>
      <a href="flashcards.html" class="active">Flashcards</a>
      <a href="notepad.html">Notepad</a>
      <a href="about.html">About</a>
      <button id="theme-btn" class="btn-primary" aria-label="Toggle theme">🌙</button>
    </div>
  </nav>

  <main class="container">
    <section class="glass-card">
      <h2 class="gradient-text">New Flashcard</h2>
      <div class="input-row">
        <input type="text" id="card-front" placeholder="Front: The Question"/>
        <input type="text" id="card-back" placeholder="Back: The Answer"/>
        <button class="btn-primary" id="add-card">Add Card</button>
      </div>
    </section>

    <section id="flashcard-grid" class="card-grid large-gap"></section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
